<!-- Formulario editar perfil -->
<div
  *ngIf="!showPasswordForm"
  class="d-flex justify-content-center align-items-center"
>
  <mat-card class="m-auto w-100 p-2">
    <mat-card-header class="mb-4">
      <mat-card-title-group>
        <mat-card-title class="text-center">
          <h5>Edita tu perfil</h5>
        </mat-card-title>
        <button mat-icon-button (click)="closeDialog()">
          <mat-icon>close</mat-icon>
        </button>
      </mat-card-title-group>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="editProfileForm" (ngSubmit)="updateProfile()">
        <mat-form-field class="w-100" hideRequiredMarker="true">
          <mat-label>Nombre</mat-label>
          <input matInput formControlName="full_name" />
        </mat-form-field>

        <mat-form-field class="w-100" hideRequiredMarker="true">
          <mat-label>Usuario</mat-label>
          <input matInput formControlName="username" />
        </mat-form-field>

        <mat-form-field class="w-100" hideRequiredMarker="true">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" />
        </mat-form-field>

        <mat-form-field class="w-100" hideRequiredMarker="true">
          <mat-label>Biografía</mat-label>
          <textarea matInput rows="5" formControlName="description"></textarea>
        </mat-form-field>

        <div>
          <button mat-flat-button class="w-100" type="submit">
            Guardar cambios
          </button>
        </div>
      </form>

      <div class="text-center mt-3">
        <p>
          Cambia tu contraseña
          <a (click)="showPasswordForm = !showPasswordForm">aquí</a>
        </p>
      </div>
    </mat-card-content>
  </mat-card>
</div>

<!-- Formulario editar contraseña -->
<div
  *ngIf="showPasswordForm"
  class="d-flex justify-content-center align-items-center"
>
  <mat-card class="m-auto w-100 p-2">
    <mat-card-header class="mb-4">
      <mat-card-title-group>
        <mat-card-title class="text-center">
          <h5>Editar contraseña</h5>
        </mat-card-title>
        <button
          mat-icon-button
          class="d-flex justify-content-center align-items-center"
          (click)="closeDialog()"
        >
          <mat-icon>close</mat-icon>
        </button>
      </mat-card-title-group>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="changePasswordForm" (ngSubmit)="updatePassword()">
        <mat-form-field class="w-100" hideRequiredMarker="true">
          <mat-label>Contraseña actual</mat-label>
          <input matInput type="password" formControlName="current_password" />
        </mat-form-field>

        <mat-form-field class="w-100" hideRequiredMarker="true">
          <mat-label>Nueva contraseña</mat-label>
          <input matInput type="password" formControlName="new_password" />
        </mat-form-field>

        <div>
          <button mat-flat-button class="w-100" type="submit">
            Actualizar contraseña
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
